const marq=new Set('Virat Kohli,Rohit Sharma,Shubman Gill,Yashasvi Jaiswal,Suryakumar Yadav,Jasprit Bumrah,Rishabh Pant,Hardik Pandya,Ravindra Jadeja,Jos Buttler,Sanju Samson,Shreyas Iyer,Rashid Khan,Travis Head,Heinrich Klaasen,Nicholas Pooran,Cameron Green,Mitchell Starc,Pat Cummins,Kagiso Rabada,Arshdeep Singh,Yuzvendra Chahal,Ruturaj Gaikwad,MS Dhoni'.split(','));

const r2=n=>Math.round(n*100)/100,fm=n=>'₹'+r2(n).toFixed(2)+' Cr';
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const pl=id=>PL.find(p=>p.id===id),tm=id=>T.find(t=>t.id===id);
let S={budget:120,ps:{},cur:null,log:[],seq:0,adj:{},phase:'auction',fin:{},trades:[],tseq:0},mode=ls.get('iplMode'),db,ref,user,canHost=true,loaded=false,built=null,bidsOn=false,resetArm=false,tt;
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2400)}
function info(t){const ros=PL.filter(p=>{const x=S.ps[p.id];return x&&x.s==='S'&&x.t===t});const spent=r2(ros.reduce((a,p)=>a+S.ps[p.id].p,0));return{ros,spent,left:r2(S.budget+(S.adj[t]||0)-spent),os:ros.filter(p=>p.cc!=='IN').length}}
function check(t,p,amt){const i=info(t);if(amt>i.left+1e-9)return'Only '+fm(i.left)+' left in your purse';if(i.ros.length>=25)return'Squad is full (25)';if(p.cc!=='IN'&&i.os>=8)return'Overseas limit (8) reached';const rem=Math.max(0,14-i.ros.length)*.3;if(amt+rem>i.left+1e-9)return'You must keep '+fm(rem)+' to reach the 15-player minimum';return''}

function lastSale(){const a=S.log[S.log.length-1];if(!a)return'Waiting for the auctioneer to post the next player…';const p=pl(a.id);return a.a==='S'?`<b>${p.name}</b> SOLD to <span class="lead-t">${a.t}</span> for ${fm(a.p)}`:`<b>${p.name}</b> went unsold`}

function push(){ls.set('iplHostState',JSON.stringify(S));conns.forEach(c=>c.open&&c.send({t:'state',s:S}));render()}

function sell(){const c=S.cur;if(!c||!c.team)return toast('No bids yet');S.ps[c.id]={s:'S',t:c.team,p:c.bid};S.log.push({id:c.id,a:'S',t:c.team,p:c.bid});S.cur=null;push()}
function unsold(){const c=S.cur;if(!c)return;S.ps[c.id]={s:'U'};S.log.push({id:c.id,a:'U'});S.cur=null;push()}
function undo(){if(S.phase!=='auction')return toast('Undo only works during the auction');const a=S.log.pop();if(!a)return;delete S.ps[a.id];S.cur=null;push()}
function nextP(rand){if(S.phase!=='auction')return toast('Auction phase is over');let a=PL.filter(p=>!S.ps[p.id]);if(!a.length)a=PL.filter(p=>S.ps[p.id]&&S.ps[p.id].s==='U');if(!a.length)return toast('Pool is empty');nominate((rand?a[Math.floor(Math.random()*a.length)]:a[0]).id)}
function handleBid(t,b){const c=S.cur;if(S.phase!=='auction'||!c||!c.open||b.lot!==c.n||b.pid!==c.id||t===c.team||!tm(t))return;const amt=r2(Number(b.amt));if(!(c.team?amt>c.bid:amt>=c.base))return;if(check(t,pl(c.id),amt))return;c.bid=amt;c.team=t;push()}
async function bid(amt){const c=S.cur;if(!c||!c.open)return;amt=r2(amt);if(!(c.team?amt>c.bid:amt>=c.base))return warn('Bid must be above '+fm(c.bid));const e=check(mode,pl(c.id),amt);if(e)return warn(e);warn('');if(hc&&hc.open)hc.send({t:'bid',team:mode,b:{lot:c.n,pid:c.id,amt}});else warn('Not connected to the auctioneer yet')}
function warn(m){const e=$('wm');if(e)e.textContent=m}
function setMode(m){mode=m;ls.set('iplMode',m);built=null;if(peer){peer.destroy();peer=null}conns=[];hc=null;if(m)needPeer(m==='host'?startHost:startClient);else render()}

function render(){if(!db)return;if(!mode)return pick();if(mode==='host'){if(!canHost){setMode(null);return}return hostUI()}bidUI()}
function pick(){built='pick';$('app').innerHTML=`<div class="top"><div><div class="eb">Live auction</div><h1>IPL Auction Room</h1></div></div><div class="panel"><b>Which device is this?</b><div id="pk">${T.map(t=>`<button class="btn big" style="--c:${t.c}" data-m="${t.id}">${t.name}<div class="muted">Bid as ${t.id}</div></button>`).join('')}${canHost?'<button class="btn gold big" style="--c:#f3b744" data-m="host">🔨 I am the auctioneer</button>':''}</div><p class="muted">Each phone picks a different team. Only the owner of this page can run the auction.</p></div>`;document.querySelectorAll('#pk button').forEach(b=>b.onclick=()=>setMode(b.dataset.m))}


const gets=new Set(),gives=new Set(),openT=new Set();let wasRisk=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=ids=>ids.map(id=>pl(id).name).join(', ')||'—';
const ct=tr=>tr.cash>0?tr.from+' pays '+fm(tr.cash):tr.cash<0?tr.from+' wants '+fm(-tr.cash):'';
function risk(t){const i=info(t);return i.ros.length<15&&i.left<S.budget*.25}
function tell(o){if(hc&&hc.open)hc.send(o);else toast('Not connected to the auctioneer')}
function squadHtml(i){return i.ros.map(p=>`<div class="li nc"><span>${p.name}<div class="muted">${RL[p.role]} · ${dom(p)} · ${p.country}</div></span><b>${fm(S.ps[p.id].p)}</b></div>`).join('')||'<div class="muted">No players yet.</div>'}
function teamsDetails(ids){return ids.map(id=>{const t=tm(id),i=info(id);return `<details data-t="${id}" ${openT.has(id)?'open':''}><summary style="color:${t.c};font-weight:800;padding:6px 0">${id} · ${i.ros.length} players · ${fm(i.left)} left · OS ${i.os}/8${risk(id)?' ⚠':''}${S.fin[id]?' ✓':''}</summary>${squadHtml(i)}</details>`}).join('')}
function bindDet(root){root.querySelectorAll('details').forEach(d=>d.ontoggle=()=>{d.open?openT.add(d.dataset.t):openT.delete(d.dataset.t)})}
function handleFin(t){if(S.phase!=='finalise'||!tm(t))return;const i=info(t);if(i.ros.length<15||i.ros.length>25||i.os>8)return;S.fin[t]=true;if(T.every(x=>S.fin[x.id]))S.phase='trade';push()}
function endAuction(){if(S.cur)return toast('Sell or mark unsold first');S.phase='finalise';S.fin={};push()}
function backAuction(){if(S.trades.length)return toast('Trades already started');S.phase='auction';S.fin={};push()}
function closeTrade(){S.phase='done';push()}
function tradeErr(tr){const sim=t=>{const i=info(t);return{n:i.ros.length,os:i.os,left:i.left}};const a=sim(tr.from),b=sim(tr.to);
for(const id of tr.get)if(!(S.ps[id]&&S.ps[id].t===tr.to))return'A player is no longer available';for(const id of tr.give)if(!(S.ps[id]&&S.ps[id].t===tr.from))return'A player is no longer available';
const mv=(ids,x,y)=>ids.forEach(id=>{x.n--;y.n++;if(pl(id).cc!=='IN'){x.os--;y.os++}});mv(tr.get,b,a);mv(tr.give,a,b);a.left-=tr.cash;b.left+=tr.cash;
for(const [n,x] of [[tr.from,a],[tr.to,b]]){if(x.n<15)return n+' would drop below 15 players';if(x.n>25)return n+' would exceed 25 players';if(x.os>8)return n+' would exceed 8 overseas';if(x.left<-1e-9)return n+' cannot afford this'}return''}
function mvp(id,to){const x=S.ps[id],f=x.t;S.adj[to]=r2((S.adj[to]||0)+x.p);S.adj[f]=r2((S.adj[f]||0)-x.p);x.t=to}
function execTrade(tr){tr.get.forEach(id=>mvp(id,tr.from));tr.give.forEach(id=>mvp(id,tr.to));S.adj[tr.from]=r2((S.adj[tr.from]||0)-tr.cash);S.adj[tr.to]=r2((S.adj[tr.to]||0)+tr.cash)}
function handleTrade(m){if(S.phase!=='trade'||!tm(m.team))return;const t=m.team;
if(m.op==='new'){const o=m.tr||{};if(!tm(o.to)||o.to===t)return;const ok=(ids,own)=>(Array.isArray(ids)?ids:[]).filter(id=>S.ps[id]&&S.ps[id].s==='S'&&S.ps[id].t===own);const get=ok(o.get,o.to),give=ok(o.give,t),cash=r2(Number(o.cash)||0);if(!get.length&&!give.length&&!cash)return;S.trades.push({id:++S.tseq,from:t,to:o.to,get,give,cash,note:String(o.note||'').slice(0,80),st:'pending',msg:''});return push()}
const tr=S.trades.find(x=>x.id===m.id);if(!tr||tr.st!=='pending')return;
if(m.op==='cancel'&&tr.from===t){tr.st='cancelled';return push()}
if(m.op==='reject'&&tr.to===t){tr.st='rejected';return push()}
if(m.op==='accept'&&tr.to===t){const e=tradeErr(tr);if(e){tr.st='failed';tr.msg=e}else{execTrade(tr);tr.st='accepted'}push()}}
function bidUI(){const t=tm(mode),oth=T.filter(x=>x.id!==mode);
if(built!==mode){built=mode;gets.clear();gives.clear();$('app').innerHTML=`<div class="top"><div><div class="eb">Bidding as</div><h1 style="color:${t.c}">${t.name}</h1></div><button class="btn sm" id="sw">Switch</button></div><div id="al"></div><div class="grid4" style="grid-template-columns:repeat(3,1fr)" id="st"></div><div class="lot" id="lot" style="margin-top:12px"></div>

const i=info(mode),c=S.cur,ph=S.phase,n=i.ros.length;
$('st').innerHTML=[['Purse left',fm(i.left),Math.round(i.left/S.budget*100)+'% of purse'],['Squad',n+'/25','min 15'],['Overseas',i.os+'/8','max 8']].map(x=>`<div class="team" style="--c:${t.c}"><small>${x[0]}</small><div class="v">${x[1]}</div><small>${x[2]}</small></div>`).join('');
const al=[];if(risk(mode))al.push(`⚠ Squad incomplete (${n}/15) and funds below 25%: only ${fm(i.left)} left for ${15-n} more players`);if(ph==='finalise'&&n<15)al.push(`⚠ Cannot finalise: you need ${15-n} more players`);
$('al').innerHTML=al.map(a=>`<div class="alert">${a}</div>`).join('');if(risk(mode)&&!wasRisk){toast('⚠ Squad & funds alert');try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}wasRisk=risk(mode);
$('bp').style.display=$('pw').style.display=ph==='auction'?'':'none';$('fp').style.display=ph==='finalise'?'':'none';$('tp').style.display=ph==='trade'?'':'none';
if(ph==='auction'&&c){const p=pl(c.id);$('lot').innerHTML=`<div class="eb">Now bidding${c.open?'':' · PAUSED'}</div><div class="pname">${p.name}</div>${tags(p)}<div class="bidv">${fm(c.bid)}</div><div>${c.team?(c.team===mode?'<span class="lead-t">You are leading!</span>':'Leading: <b style="color:'+tm(c.team).c+'">'+c.team+'</b>'):'<span class="muted">No bids yet · opening at base price</span>'}</div>`}
else $('lot').innerHTML=ph==='auction'?`<div class="eb">Lot closed</div><div style="margin-top:8px;font-size:16px">${lastSale()}</div>`:`<div class="eb">${{finalise:'Auction over',trade:'Trade window open',done:'Complete'}[ph]}</div><div style="margin-top:8px;font-size:16px">${{finalise:'Review your squad and finalise it. Trading opens when all 4 teams finalise.',trade:'Offer swaps or cash for players from other teams.',done:'Trading is closed. Squads are final.'}[ph]}</div>`;
const ok=ph==='auction'&&c&&c.open&&c.team!==mode;$('b1').disabled=$('b2').disabled=$('bc').disabled=!ok;
$('b1').textContent=c?(c.team?'+25 L → '+fm(c.bid+.25):'Bid '+fm(c.base)):'+25 L';$('b2').textContent=c?(c.team?'+50 L → '+fm(c.bid+.5):'Bid '+fm(c.base+.25)):'+50 L';
if(ph==='finalise'){$('ft').innerHTML=T.map(x=>x.id+(S.fin[x.id]?' ✓':' …')).join(' · ')+(n<15?'<br>Need '+(15-n)+' more players to finalise (min 15).':'');$('fb').disabled=!!S.fin[mode]||n<15||n>25;$('fb').textContent=S.fin[mode]?'Finalised ✓ waiting for others':'Finalise my team'}
if(ph==='trade'){tlists();$('tin').innerHTML=S.trades.filter(x=>x.to===mode&&x.st==='pending').map(tr=>`<div class="li nc" style="display:block">${tr.from} asks for: ${nm(tr.get)}<br>offers: ${nm(tr.give)}${ct(tr)?'<br>'+ct(tr):''}${tr.note?'<br>“'+esc(tr.note)+'”':''}<div class="row"><button class="btn gold sm" data-a="accept" data-id="${tr.id}">Accept</button><button class="btn sm" data-a="reject" data-id="${tr.id}">Reject</button></div></div>`).join('')||'<div class="muted">None.</div>';
$('tout').innerHTML=S.trades.filter(x=>x.from===mode).slice().reverse().map(tr=>`<div class="li nc" style="display:block">To ${tr.to}: want ${nm(tr.get)} · offer ${nm(tr.give)}${ct(tr)?' · '+ct(tr):''}<div class="muted">${tr.st}${tr.msg?' — '+esc(tr.msg):''}</div>${tr.st==='pending'?`<button class="btn sm" data-a="cancel" data-id="${tr.id}">Cancel</button>`:''}</div>`).join('')||'<div class="muted">None.</div>';
document.querySelectorAll('#tin button,#tout button').forEach(b=>b.onclick=()=>tell({t:'trade',op:b.dataset.a,id:+b.dataset.id,team:mode}))}
$('rh').textContent=`My squad (${n})`;$('ros').innerHTML=squadHtml(i);$('oth').innerHTML=teamsDetails(oth.map(x=>x.id));bindDet($('oth'));bpool()}
function tlists(){const to=$('tt').value,chk=(k,p)=>`<label class="li nc"><span><input type="checkbox" data-k="${k}" data-id="${p.id}" ${(k==='g'?gets:gives).has(p.id)?'checked':''} style="width:auto;margin-right:8px">${p.name}<div class="muted">${RL[p.role]} · ${dom(p)} · ${fm(S.ps[p.id].p)}</div></span></label>`;
$('tg').innerHTML=info(to).ros.map(p=>chk('g',p)).join('')||'<div class="muted">No players</div>';$('tv').innerHTML=info(mode).ros.map(p=>chk('v',p)).join('')||'<div class="muted">No players</div>';
document.querySelectorAll('#tp input[data-k]').forEach(e=>e.onchange=()=>{const set=e.dataset.k==='g'?gets:gives;e.checked?set.add(e.dataset.id):set.delete(e.dataset.id)})}
function dom(p){return p.cc==='IN'?'Domestic':'Overseas'}
function bpool(){const rf=$('prf').value,of=$('pof').value,sold=PL.filter(p=>S.ps[p.id]&&S.ps[p.id].s==='S').length;const a=PL.filter(p=>(!S.ps[p.id]||S.ps[p.id].s==='U')&&(!rf||p.role===rf)&&(!of||(of==='D')===(p.cc==='IN')));$('ph').textContent=`Player pool · ${PL.length-sold} left of ${PL.length} (${sold} sold)`;$('bpool').innerHTML=a.map(p=>`<div class="li nc"><span>${p.name}<div class="muted">${RL[p.role]} · ${dom(p)} · ${p.country}${S.ps[p.id]?' · unsold':''}</div></span><b>${fm(p.base)}</b></div>`).join('')||'<div class="muted">No players match.</div>'}
function hostUI(){if(built!=='host'){built='host';$('app').innerHTML=`<div class="top"><div><div class="eb">Auctioneer console</div><h1>IPL Auction Live</h1><div class="muted" id="rc" style="cursor:pointer"></div></div><div style="display:flex;gap:6px"><button class="btn sm" id="un">↶ Undo</button><button class="btn sm" id="sw">Switch</button></div></div><div class="grid4" id="tms"></div>
<div class="panel" style="margin-top:12px"><b>Phase: <span id="phl"></span></b><div class="muted" id="fns" style="margin:6px 0"></div><div class="row"><button class="btn gold" id="pe">End auction → Finalise</button><button class="btn" id="pb">Back to auction</button><button class="btn red" id="pc">Close trades</button></div></div>
<div class="panel"><div class="lot" id="lot"></div><div class="row"><button class="btn gold" id="sl">🔨 Sell</button><button class="btn" id="us">Unsold</button><button class="btn" id="ps">Pause</button></div><div class="row"><button class="btn" id="nx">Next in order</button><button class="btn" id="rn">🎲 Random</button></div></div>
<div class="panel"><b id="hp">Player pool</b><div class="row"><input id="q" placeholder="Search…"><select id="rf"><option value="">All</option>${Object.keys(RL).map(k=>`<option value="${k}">${RL[k]}</option>`).join('')}</select><select id="of"><option value="">Dom + Overseas</option><option value="D">Domestic</option><option value="O">Overseas</option></select></div><div class="scroll" id="pool" style="margin-top:8px"></div></div>
<div class="panel"><b>Trade offers</b><div class="scroll" id="htr"></div></div><div class="panel"><b>Team squads</b><div id="ros"></div></div><div class="panel"><b>Log</b><div class="scroll" id="log"></div></div>
<div class="panel"><b>Settings</b><div id="fx"></div><div class="row"><input id="bg" type="number" min="1" placeholder="Purse (₹ Cr)"><button class="btn red" id="rs">Reset auction</button></div><div class="muted" style="margin-top:6px">Purse can only change before the first sale.</div></div>`;
$('sw').onclick=()=>setMode(null);$('un').onclick=undo;$('sl').onclick=sell;$('us').onclick=unsold;$('nx').onclick=()=>nextP(false);$('rn').onclick=()=>nextP(true);$('ps').onclick=()=>{if(S.cur){S.cur.open=!S.cur.open;push()}};$('pe').onclick=endAuction;$('pb').onclick=backAuction;$('pc').onclick=closeTrade;$('q').oninput=$('rf').oninput=$('of').oninput=pool;
$('fx').innerHTML='<div class="muted" style="margin:6px 0">Fix a team’s remaining purse (₹ Cr), then tap Set</div>'+T.map(t=>`<div class="row"><span style="flex:0 0 50px;padding-top:11px;color:${t.c};font-weight:800">${t.id}</span><input id="f${t.id}" type="number" step="0.05"><button class="btn sm" data-f="${t.id}" style="flex:0 0 70px">Set</button></div>`).join('');document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const t=b.dataset.f,v=parseFloat($('f'+t).value);if(!(v>=0))return toast('Enter a valid amount');S.adj[t]=r2(v-(S.budget-info(t).spent));push();toast(t+' purse set to '+fm(v))});
$('bg').value=S.budget;$('bg').onchange=e=>{const n=Number(e.target.value);if(n>0&&!S.log.some(a=>a.a==='S')){S.budget=n;push()}else{e.target.value=S.budget;toast('Cannot change after a sale')}};
$('rs').onclick=()=>{if(!resetArm){resetArm=true;$('rs').textContent='Tap again to confirm';setTimeout(()=>{resetArm=false;if($('rs'))$('rs').textContent='Reset auction'},3000);return}resetArm=false;S={budget:S.budget,ps:{},cur:null,log:[],seq:S.seq+1,adj:{},phase:'auction',fin:{},trades:[],tseq:0};push()}}
const c=S.cur,ph=S.phase;const rcEl=$('rc');rcEl.innerHTML='Room code <b>'+code+'</b> · tap to copy invite link';rcEl.onclick=()=>{const u=location.origin+location.pathname+'#'+code;try{navigator.clipboard.writeText(u)}catch(e){}toast('Invite link copied')};
$('tms').innerHTML=T.map(t=>{const i=info(t.id);return `<div class="team ${c&&c.team===t.id?'lead':''}" style="--c:${t.c}"><b>${t.id}${S.fin[t.id]?' ✓':''}</b><div class="v">${fm(i.left)}</div><small>${i.ros.length}/25 (min 15) · OS ${i.os}/8</small>${risk(t.id)?'<small style="color:#ff8a8a;font-weight:800">⚠ squad + funds risk</small>':''}</div>`}).join('');
$('phl').textContent={auction:'Auction',finalise:'Finalising squads',trade:'Trade window',done:'Complete'}[ph];$('fns').textContent=ph==='finalise'?'Finalised: '+T.map(x=>x.id+(S.fin[x.id]?' ✓':' …')).join('  '):'';
$('pe').disabled=ph!=='auction'||!!c;$('pb').disabled=ph!=='finalise';$('pc').disabled=ph!=='trade';
$('lot').innerHTML=c?`<div class="eb">On the block${c.open?'':' · PAUSED'}</div><div class="pname">${pl(c.id).name}</div>${tags(pl(c.id))}<div class="bidv">${fm(c.bid)}</div><div>${c.team?'Leading: <b class="lead-t">'+tm(c.team).name+'</b>':'<span class="muted">Waiting for bids from the 4 phones…</span>'}</div>`:`<div class="eb">${ph==='auction'?'No player on the block':'Phase: '+$('phl').textContent}</div><div style="margin-top:8px">${ph==='auction'?lastSale():''}</div>`;
$('sl').disabled=!(c&&c.team);$('us').disabled=!c;$('ps').disabled=!c;$('ps').textContent=c&&!c.open?'Resume':'Pause';$('un').disabled=!S.log.length||ph!=='auction';$('nx').disabled=$('rn').disabled=!!c||ph!=='auction';
T.forEach(t=>{const e=$('f'+t.id);if(e&&document.activeElement!==e)e.value=info(t.id).left});
pool();
$('htr').innerHTML=S.trades.slice().reverse().map(tr=>`<div class="li nc" style="display:block">#${tr.id} ${tr.from} → ${tr.to} · wants ${nm(tr.get)} · offers ${nm(tr.give)}${ct(tr)?' · '+ct(tr):''}${tr.note?' · “'+esc(tr.note)+'”':''}<div class="muted">${tr.st}${tr.msg?' — '+esc(tr.msg):''}</div></div>`).join('')||'<div class="muted">No offers yet.</div>';
$('ros').innerHTML=teamsDetails(T.map(x=>x.id));bindDet($('ros'));
$('log').innerHTML=[...S.log].reverse().map(a=>`<div class="li nc"><span>${pl(a.id).name} <span class="muted">${a.a==='S'?'→ '+a.t:'· unsold'}</span></span><b>${a.a==='S'?fm(a.p):''}</b></div>`).join('')||'<div class="muted">Nothing yet.</div>'}
function pool(){const q=($('q').value||'').toLowerCase(),rf=$('rf').value,of=$('of').value,c=S.cur;const a=PL.filter(p=>(!S.ps[p.id]||S.ps[p.id].s==='U')&&(!rf||p.role===rf)&&(!of||(of==='D')===(p.cc==='IN'))&&(!q||p.name.toLowerCase().includes(q)||p.country.toLowerCase().includes(q)));$('hp').textContent=`Player pool · ${a.length} shown · ${PL.filter(p=>S.ps[p.id]&&S.ps[p.id].s==='S').length}/${PL.length} sold`;$('pool').innerHTML=a.map(p=>`<div class="li" data-id="${p.id}"><span>${p.name}<div class="muted">${RL[p.role]} · ${dom(p)} · ${p.country}${S.ps[p.id]?' · unsold':''}</div></span><b>${fm(p.base)}</b></div>`).join('')||'<div class="muted">No players match.</div>';document.querySelectorAll('#pool .li').forEach(e=>e.onclick=()=>{if(S.cur||S.phase!=='auction')return toast(S.cur?'Sell or mark unsold first':'Auction phase is over');nominate(e.dataset.id)})}

function needPeer(f){if(window.Peer)return f();let t=0;const iv=setInterval(()=>{if(window.Peer){clearInterval(iv);f()}else if(++t>40){clearInterval(iv);toast('Could not load the PeerJS library. Check your internet connection.')}},250)}
let peer,hc,conns=[];const code=ls.get('iplCode')||Math.random().toString(36).slice(2,7).toUpperCase();
function startHost(){ls.set('iplCode',code);try{const sv=JSON.parse(ls.get('iplHostState'));if(sv)S=norm(sv)}catch(e){}loaded=true;
peer=new Peer('iplauction-'+code);
peer.on('connection',c=>{c.on('open',()=>{conns.push(c);c.send({t:'state',s:S});toast('A bidder joined')});c.on('data',m=>{if(!m)return;if(m.t==='bid')handleBid(m.team,m.b);else if(m.t==='fin')handleFin(m.team);else if(m.t==='trade')handleTrade(m)});c.on('close',()=>{conns=conns.filter(x=>x!==c)})});
peer.on('error',e=>toast(e.type==='unavailable-id'?'Room already open in another tab':'Network: '+e.type));render()}
function leave(){ls.set('iplRoom',null);ls.set('iplMode',null);mode=null;built=null;render()}
function startClient(){let rc=(location.hash.slice(1)||ls.get('iplRoom')||'').toUpperCase();if(!rc){rc=(prompt('Room code from the auctioneer')||'').trim().toUpperCase();if(!rc)return leave()}
ls.set('iplRoom',rc);peer=new Peer();
peer.on('open',()=>{hc=peer.connect('iplauction-'+rc,{reliable:true});hc.on('open',()=>toast('Connected'));hc.on('data',m=>{if(m&&m.t==='state'){S=norm(m.s);render()}});hc.on('close',()=>{toast('Disconnected · retrying');setTimeout(()=>{if(mode&&mode!=='host')setMode(mode)},2000)})});
peer.on('error',e=>{if(e.type==='peer-unavailable'){history.replaceState(null,'',location.pathname);toast('Room not found');return leave()}toast('Connection: '+e.type);setTimeout(()=>{if(mode&&mode!=='host')setMode(mode)},3000)});render()}
db=true;if(mode)needPeer(mode==='host'?startHost:startClient);render();
function startBids(){}
</script></body></html>
