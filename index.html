function rOf(p){if(p.r!=null)return p.r;if(marq.has(p.name))return 0;return p.role==='Legend'?6:{Bat:1,WK:2,AR:3,Fast:4,Spin:5}[p.role]}
function eligible(p){const x=S.ps[p.id];return S.rd<7?(!x&&rOf(p)===S.rd):!!(x&&x.s==='U')}

function genCodes(){let ch=false;const used=new Set(Object.values(S.codes));T.forEach(t=>{if(!S.codes[t.id]){let k;do{k=rk(4)}while(used.has(k));used.add(k);S.codes[t.id]=k;ch=true}});return ch}

/* ---------- host actions ---------- */
function push(){S.v=(S.v||0)+1;ls.set('iplHostState',JSON.stringify(S));const m={t:'state',s:pub()};conns.forEach(c=>{if(c.open&&c.team)try{c.send(m)}catch(e){}});render()}
function nominate(id){const p=pl(id);S.seq++;S.cur={id,n:S.seq,base:bp(p),bid:bp(p),team:null,out:[],open:true,cd:0,cdt:Date.now(),auto:S.autoOn};push()}
function sell(){const c=S.cur;if(!c||!c.team)return toast('No bids yet');const pv=S.ps[c.id]||null;S.ps[c.id]={s:'S',t:c.team,p:c.bid};S.log.push({id:c.id,a:'S',t:c.team,p:c.bid,pv});S.cur=null;push()}
function unsold(){const c=S.cur;if(!c)return;const pv=S.ps[c.id]||null;S.ps[c.id]={s:S.rd>=7?'X':'U'};S.log.push({id:c.id,a:'U',pv});S.cur=null;push()}
function undo(){if(S.phase!=='auction')return toast('Undo only works during the auction');const a=S.log.pop();if(!a)return;if(a.pv)S.ps[a.id]=a.pv;else delete S.ps[a.id];S.cur=null;push()}
function nextP(rand){if(S.phase!=='auction')return toast('The auction phase is over');const a=PL.filter(eligible);if(!a.length)return toast(S.rd<7?'Round complete. Start the next round':'Final round complete. End the auction');nominate((rand?a[Math.floor(Math.random()*a.length)]:a[0]).id)}
function nextRound(){if(S.cur)return toast('Sell or mark unsold first');if(S.phase!=='auction'||S.rd>=7)return;const left=PL.filter(eligible).length;if(left&&!confirm(left+' players are still left in this round. Move them to the unsold round and continue?'))return;PL.filter(p=>!S.ps[p.id]&&rOf(p)===S.rd).forEach(p=>S.ps[p.id]={s:'U'});S.rd++;push();toast(rtxt()+' started')}
function callStep(){const c=S.cur;if(!c||!c.open)return;c.auto=false;if((c.cd||0)<3){c.cd=(c.cd||0)+1;c.cdt=Date.now();push()}else c.team?sell():unsold()}
function toggleAuto(){S.autoOn=!S.autoOn;if(S.cur){S.cur.auto=S.autoOn;S.cur.cd=0;S.cur.cdt=Date.now()}push()}
function editBase(id){const p=pl(id),c=S.cur;if(c&&c.id===id&&c.team)return toast('Bids already placed');const v=r2(parseFloat(prompt('New base price for '+p.name+' (₹ Cr)',bp(p))));if(!(v>0))return;S.bp[id]=v;if(c&&c.id===id){c.base=c.bid=v}push()}
function addPlayer(){const name=$('an').value.trim();if(!name)return toast('Enter a player name');if(PL.some(p=>p.name.toLowerCase()===name.toLowerCase()))return toast('That player is already in the pool');const dm=$('ad').value==='D',base=r2(parseFloat($('ab').value)||0.3);if(!(base>0))return toast('Enter a valid base price');const o={id:'c'+(++S.cseq),name,cc:dm?'IN':'XX',country:dm?'India':($('ac').value.trim()||'Overseas'),role:$('ar').value,base,r:$('ao').value===''?null:+$('ao').value};S.custom.push(o);addCustom([o]);if(rOf(pl(o.id))<S.rd)S.ps[o.id]={s:'U'};$('an').value=$('ac').value=$('ab').value='';toast(name+' added to the pool');push()}
function endAuction(){if(S.cur)return toast('Sell or mark unsold first');S.phase='finalise';S.fin={};push()}
function backAuction(){if(S.trades.length)return toast('Trades have already started');S.phase='auction';S.fin={};push()}
function closeTrade(){S.phase='done';push()}
function finDone(){const a=AT();return a.length&&a.every(x=>S.fin[x.id])}
function kick(id,why){conns.filter(c=>c.team===id).forEach(c=>{try{c.send({t:'denied',why});setTimeout(()=>{try{c.close()}catch(e){}},300)}catch(e){}})}
function removeTeam(id){S.gone[id]=true;kick(id,'The auctioneer removed your team from this auction');const c=S.cur;if(c&&c.team===id){c.team=null;c.bid=c.base}if(S.phase==='finalise'&&finDone())S.phase='trade';push();toast(id+' removed')}
function restoreTeam(id){delete S.gone[id];push();toast(id+' restored')}
function newCode(id){const used=new Set(Object.values(S.codes));let k;do{k=rk(4)}while(used.has(k));S.codes[id]=k;kick(id,'Your team code was changed. Ask the auctioneer for the new one');push();toast('New code for '+id)}
const full=id=>code+'-'+(S.codes[id]||''),link=id=>location.origin+location.pathname+'#'+code+(S.codes[id]||'');
function cp(t,m){try{navigator.clipboard.writeText(t).then(()=>toast(m),()=>cpf(t,m))}catch(e){cpf(t,m)}}
function cpf(t,m){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');toast(m)}catch(e){toast('Copy failed. Select the code manually')}a.remove()}
function arm(k){if(armK===k){armK='';clearTimeout(armT);return true}armK=k;clearTimeout(armT);armT=setTimeout(()=>{armK='';render()},3000);render();return false}

/* ---------- host: handle messages from bidders (team comes from the connection) ---------- */
function handleBid(t,b){const c=S.cur;if(gone(t))return'Your team was removed';if(S.phase!=='auction'||!c||!c.open||!b||b.lot!==c.n||b.pid!==c.id)return'Bidding is closed for this player';if((c.out||[]).includes(t))return'You walked out of this player';if(t===c.team)return'You already lead this bid';const amt=r2(Number(b.amt));if(!(c.team?amt>c.bid:amt>=c.base))return'Bid must be above '+fm(c.bid);const e=check(t,pl(c.id),amt);if(e)return e;c.bid=amt;c.team=t;c.cd=0;c.cdt=Date.now();push();return''}
function handleOut(t,b){const c=S.cur;if(gone(t))return'Your team was removed';if(S.phase!=='auction'||!c||!c.open||!b||b.lot!==c.n||b.pid!==c.id)return'This player is no longer on the block';if(t===c.team)return"You're leading, so you can't walk out";c.out=c.out||[];if(c.out.includes(t))return'';c.out.push(t);if(!c.team&&AT().every(x=>c.out.includes(x.id))){unsold();return''}push();return''}
function handleFin(t){if(S.phase!=='finalise'||gone(t))return;const i=info(t);if(i.ros.length<15||i.ros.length>25||i.os>8)return;S.fin[t]=true;if(finDone())S.phase='trade';push()}
function tradeErr(tr){const sim=t=>{const i=info(t);return{n:i.ros.length,os:i.os,left:i.left}};const a=sim(tr.from),b=sim(tr.to);
for(const id of tr.get)if(!(S.ps[id]&&S.ps[id].t===tr.to))return'A player is no longer available';for(const id of tr.give)if(!(S.ps[id]&&S.ps[id].t===tr.from))return'A player is no longer available';
const mv=(ids,x,y)=>ids.forEach(id=>{x.n--;y.n++;if(pl(id).cc!=='IN'){x.os--;y.os++}});mv(tr.get,b,a);mv(tr.give,a,b);a.left-=tr.cash;b.left+=tr.cash;
for(const [n,x] of [[tr.from,a],[tr.to,b]]){if(x.n<15)return n+' would drop below 15 players';if(x.n>25)return n+' would exceed 25 players';if(x.os>8)return n+' would exceed 8 overseas';if(x.left<-1e-9)return n+' cannot afford this'}return''}
function mvp(id,to){const x=S.ps[id],f=x.t;S.adj[to]=r2((S.adj[to]||0)+x.p);S.adj[f]=r2((S.adj[f]||0)-x.p);x.t=to}
function execTrade(tr){tr.get.forEach(id=>mvp(id,tr.from));tr.give.forEach(id=>mvp(id,tr.to));S.adj[tr.from]=r2((S.adj[tr.from]||0)-tr.cash);S.adj[tr.to]=r2((S.adj[tr.to]||0)+tr.cash)}
function handleTrade(t,m){if(S.phase!=='trade'||!tm(t)||gone(t))return;
if(m.op==='new'){const o=m.tr||{};if(!tm(o.to)||o.to===t||gone(o.to))return;const ok=(ids,own)=>(Array.isArray(ids)?ids:[]).filter(id=>S.ps[id]&&S.ps[id].s==='S'&&S.ps[id].t===own);const get=ok(o.get,o.to),give=ok(o.give,t),cash=r2(Number(o.cash)||0);if(!get.length&&!give.length&&!cash)return;S.trades.push({id:++S.tseq,from:t,to:o.to,get,give,cash,note:String(o.note||'').slice(0,80),st:'pending',msg:''});return push()}
const tr=S.trades.find(x=>x.id===m.id);if(!tr||tr.st!=='pending')return;
if(m.op==='cancel'&&tr.from===t){tr.st='cancelled';return push()}
if(m.op==='reject'&&tr.to===t){tr.st='rejected';return push()}
if(m.op==='accept'&&tr.to===t){const e=tradeErr(tr);if(e){tr.st='failed';tr.msg=e}else{execTrade(tr);tr.st='accepted'}push()}}
function onMsg(c,m){if(!m)return;
if(m.t==='join'){const key=String(m.key||'').toUpperCase(),id=Object.keys(S.codes).find(k=>S.codes[k]===key);
if(!id)return c.send({t:'denied',why:'That team code is not valid. Check it with the auctioneer'});
if(gone(id))return c.send({t:'denied',why:'The auctioneer removed this team from the auction'});
conns.filter(x=>x!==c&&x.team===id).forEach(x=>{try{x.send({t:'denied',why:'This team signed in on another device',soft:1});setTimeout(()=>{try{x.close()}catch(e){}},300)}catch(e){}});
conns=conns.filter(x=>x===c||x.team!==id);c.team=id;if(!conns.includes(c))conns.push(c);c.send({t:'joined',team:id,s:pub()});toast(id+' joined');render();return}
if(!c.team)return;
if(m.t==='ping'){c.send({t:'pong'});if(m.v!==S.v)c.send({t:'state',s:pub()});return}
let e='';
if(m.t==='bid')e=handleBid(c.team,m.b);else if(m.t==='out')e=handleOut(c.team,m.b);else if(m.t==='fin')handleFin(c.team);else if(m.t==='trade')handleTrade(c.team,m);
if(e){c.send({t:'msg',m:e});c.send({t:'state',s:pub()})}}

/* ---------- networking ---------- */
function needPeer(f){if(window.Peer)return f();let t=0;const iv=setInterval(()=>{if(window.Peer){clearInterval(iv);f()}else if(++t>40){clearInterval(iv);toast('Could not load the PeerJS library. Check your internet connection.')}},250)}
function loadHost(){try{const sv=JSON.parse(ls.get('iplHostState'));if(sv)S=norm(sv)}catch(e){}genCodes();ls.set('iplHostState',JSON.stringify(S))}
function startHost(){ls.set('iplCode',code);loadHost();
peer=new Peer('iplauction-'+code);
peer.on('connection',c=>{c.on('data',m=>onMsg(c,m));c.on('close',()=>{const had=conns.includes(c);conns=conns.filter(x=>x!==c);if(had&&mode==='host')render()});c.on('error',()=>{})});
peer.on('error',e=>toast(e.type==='unavailable-id'?'This room is already open in another tab':'Network: '+e.type));render()}
function leave(why){ls.set('iplRoom',null);ls.set('iplKey',null);ls.set('iplMode',null);mode=null;built=null;got=false;if(peer){try{peer.destroy()}catch(e){}peer=null}hc=null;try{history.replaceState(null,'',location.pathname)}catch(e){}if(why)toast(why);render()}
function startClient(){const room=ls.get('iplRoom'),key=ls.get('iplKey');if(!room||!key)return leave();
cstart=Date.now();peer=new Peer();
peer.on('open',()=>{const c=hc=peer.connect('iplauction-'+room,{reliable:true});
c.on('open',()=>{lastPong=Date.now();c.send({t:'join',key})});
c.on('data',m=>{if(!m)return;lastPong=Date.now();
if(m.t==='joined'){mode=m.team;ls.set('iplMode',m.team);S=norm(m.s);got=true;built=null;try{history.replaceState(null,'',location.pathname)}catch(e){}render()}
else if(m.t==='state'){S=norm(m.s);got=true;render()}
else if(m.t==='msg'){warn(m.m);toast(m.m)}
else if(m.t==='denied'){if(m.soft){leave(m.why)}else leave(m.why)}});
c.on('close',()=>reconnect())});
peer.on('error',e=>{if(e.type==='peer-unavailable'){if(got)return reconnect();return leave('Room not found. Check the code and make sure the auctioneer has the page open')}reconnect()});render()}
function reconnect(){if(rt||!mode||mode==='host'||mode==='join'&&!got&&!ls.get('iplKey'))return;rt=setTimeout(()=>{rt=0;if(!mode||mode==='host')return;if(peer){try{peer.destroy()}catch(e){}peer=null}hc=null;needPeer(startClient)},1800);render()}
setInterval(()=>{if(!mode||mode==='host')return;if(hc&&hc.open){try{hc.send({t:'ping',v:S.v})}catch(e){}if(Date.now()-lastPong>15000){toast('Connection lost. Reconnecting…');lastPong=Date.now();hc=null;reconnect()}}else if(!rt&&cstart&&Date.now()-cstart>12000){cstart=Date.now();reconnect()}},4000);
setInterval(()=>{const c=S.cur;if(mode!=='host'||S.phase!=='auction'||!c||!c.open||!c.auto)return;const k=Math.min(4,Math.floor((Date.now()-c.cdt)/(S.tick*1000)));if(k>=4){c.team?sell():unsold()}else if(k!==c.cd){c.cd=k;push()}},500);

/* ---------- bidder actions ---------- */
function tell(o){if(hc&&hc.open)hc.send(o);else toast('Not connected to the auctioneer yet')}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,d=b.dataset,id=d.id;
switch(a){

case'host':mode='host';ls.set('iplMode','host');built=null;loadHost();needPeer(startHost);render();break;
case'cancel':leave();break;

case'undo':undo();break;case'sell':sell();break;case'unsold':unsold();break;case'nx':nextP(false);break;case'rn':nextP(true);break;case'call':callStep();break;case'auto':toggleAuto();break;case'nr':nextRound();break;case'pe':endAuction();break;case'pb':backAuction();break;case'pc':closeTrade();break;case'addp':addPlayer();break;
